# Custom Dark Theme with Cyan and Magenta accents
name: custom_dark

# Primary color (cyan for links, buttons, highlights)
primary: "#00CED1"  # Cyan

# Secondary/accent color (magenta)
link: "#00CED1"  # Cyan for links
link_hover: "#FF00FF"  # Magenta on hover

# Background colors (dark theme)
background: "#1a1a1a"  # Dark background
home_section_odd: "#1a1a1a"
home_section_even: "#242424"

# Text colors
body_text: "#e0e0e0"  # Light gray text
body_text_secondary: "#b0b0b0"

# Navigation
menu_primary: "#00CED1"  # Cyan
menu_text: "#e0e0e0"
menu_text_active: "#00CED1"
menu_title: "#ffffff"

# Accent colors
accent: "#FF00FF"  # Magenta

# Cards and boxes
card_bg: "#242424"
card_border: "#333333"
