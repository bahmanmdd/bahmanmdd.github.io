# Custom social sharing links
# Override default page_sharer.yaml to improve LinkedIn sharing
# Docs: https://docs.hugoblox.com/reference/page-sharer/

links:
  - id: x
    url: 'https://twitter.com/intent/tweet?url={url}&text={title}'
    title: X
    icon: brands/x
    enable: true
  - id: facebook
    url: 'https://www.facebook.com/sharer.php?u={url}&t={title}'
    title: Facebook
    icon: brands/facebook
    enable: true
  - id: email
    url: 'mailto:?subject={title}&body={url}'
    title: Email
    icon: hero/at-symbol
    enable: true
  - id: linkedin
    # Using modern LinkedIn sharing API that properly pre-fills the post
    url: 'https://www.linkedin.com/sharing/share-offsite/?url={url}'
    title: LinkedIn
    icon: brands/linkedin
    enable: true
  - id: whatsapp
    url: 'whatsapp://send?text={title}%20{url}'
    title: WhatsApp
    icon: brands/whatsapp
    enable: false
